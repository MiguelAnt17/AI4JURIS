[project]
name = "ai4juris"
version = "0.1.0"
description = "XAI for encoder-based legal decision classification (Sumario -> Decisao)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas==3.0.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "torch==2.12.1",
    "transformers==5.10.2",
    "accelerate==1.14.0",
    "requests==2.34.2",
    "tqdm==4.68.1",
    "matplotlib==3.10.9",
    "python-dotenv>=1.0.0",
    "peft>=0.13.0",
    "ijson>=3.2.0",
]

[project.optional-dependencies]
eda = [
    "seaborn==0.13.2",
    "plotly==6.8.0",
    "spacy==3.8.14",
    "rapidfuzz==3.14.5",
    "langdetect==1.0.9",
    "umap-learn==0.5.12",
    "python-docx==1.2.0",
]
xai = [
    "lime>=0.2.0.1",
    "captum>=0.7.0",
]
llm = [
    "vllm>=0.6.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
